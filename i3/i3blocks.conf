# ============================================================
#                  i3blocks - DAYLIGHT THEME
# ============================================================
#
# Designed for the dark slate i3 bar:
#
# Bar background : #253746
# Main text      : #f1f5f7
# Secondary      : #b8c4cc
# Cyan accent    : #62c3cf
# Green          : #7dcc9b
# Gold           : #e4b65c
#
# ============================================================


# ============================================================
# GLOBAL
# ============================================================

command=/usr/share/i3blocks/$BLOCK_NAME

separator=false
separator_block_width=15

markup=none



# ============================================================
# MEMORY
# ============================================================

[memory]
label=
command=free -h | awk '/^Mem:/ {print $3 "/" $2}'
interval=20
color=#f1f5f7


# ============================================================
# SWAP
# ============================================================

[swap]
label=
command=free -h | awk '/^Swap:/ {print $3 "/" $2}'
interval=30
color=#aebcc6


# ============================================================
# DISK
# ============================================================

[disk]
label=
command=df -h / | awk 'NR==2 {print $3 "/" $2}'
interval=60
color=#aebcc6


# ============================================================
# WIFI
# ============================================================

[wifi]
label=
command=nmcli -t -f active,ssid dev wifi | awk -F: '$1=="yes" {print $2; found=1; exit} END {if (!found) print "Offline"}'
interval=10
color=#62c3cf


# ============================================================
# NETWORK BANDWIDTH
# ============================================================

[bandwidth]
command=~/.config/.scripts/bandwidth
interval=3
color=#9fc4c9

# ============================================================
# AUDIO
# ============================================================

[volume]
label=
command=pactl get-sink-volume @DEFAULT_SINK@ | awk 'NR==1 {print $5}'
interval=2
signal=10
color=#f1f5f7

# ============================================================
# BRIGHTNESS
# ============================================================

[brightness]

label=

command=cat /sys/class/backlight/intel_backlight/brightness

interval=once

# Warm sunlight gold
color=#e4b65c


# ============================================================
# BATTERY
# ============================================================

[battery_icon]

command=~/.config/.scripts/battery_1.sh

interval=30

# Color is controlled by battery_1.sh


# ============================================================
# TIME
# ============================================================

[time]

label=

command=date '+%a %d %b %H:%M'

interval=60

# Bright cool blue
color=#82b8e8